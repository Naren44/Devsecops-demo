name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks (Secrets Scan)
        run: |
          docker run --rm \
            -v $(pwd):/repo \
            zricethezav/gitleaks detect \
            --source="/repo" \
            --verbose \
            --redact \
            --exit-code 1
