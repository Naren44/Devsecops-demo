name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: |
          echo "Listing files:"
          ls -R

      - name: Install Gitleaks
        run: |
         LATEST_RELEASE=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d'"' -f4)
         wget https://github.com/gitleaks/gitleaks/releases/download/${LATEST_RELEASE}/gitleaks_linux_x64.tar.gz
         tar -xzf gitleaks_linux_x64.tar.gz
         chmod +x gitleaks
         
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
      
